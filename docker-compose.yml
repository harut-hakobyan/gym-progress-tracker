services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-progress-tracker-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    networks:
      - gym

  nginx:
    image: nginx:1.27-alpine
    container_name: gym-progress-tracker-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gym

  mysql:
    image: mysql:8.4
    container_name: gym-progress-tracker-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: gym_progress_tracker
      MYSQL_USER: gym
      MYSQL_PASSWORD: gym_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql-data-v2:/var/lib/mysql
    networks:
      - gym

  redis:
    image: redis:7.4-alpine
    container_name: gym-progress-tracker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data-v2:/data
    networks:
      - gym

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-progress-tracker-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --queue=default,telegram --sleep=3 --tries=3 --timeout=120
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - gym

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-progress-tracker-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - gym

volumes:
  mysql-data-v2:
  redis-data-v2:

networks:
  gym:
    driver: bridge
